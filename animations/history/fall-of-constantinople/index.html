<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İstanbul'un Fethi · 1453</title>
<meta name="description" content="Bin yıllık surlar elli üç günde nasıl aşıldı? Canlanan bir minyatür harita üzerinde 1453 kuşatması.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=Alegreya+SC:wght@500;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23B3362B%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stage" aria-label="İstanbul'un 1453'teki haritası"></canvas>

<div id="seal" aria-live="polite">
  <div class="seal-no"></div>
  <div class="seal-title"></div>
  <div class="seal-date"></div>
  <div class="seal-days" hidden><i></i><span></span></div>
</div>

<div id="subs" aria-live="off"><div class="subs-inner"></div></div>

<div id="bar">
  <button id="play" class="ico" aria-label="Oynat / duraklat (boşluk)"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  <button id="prev" class="ico" aria-label="Önceki bölüm"><svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zM10 12l9-6v12z"/></svg></button>
  <button id="next" class="ico" aria-label="Sonraki bölüm"><svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM14 12L5 6v12z"/></svg></button>
  <div id="track" role="slider" aria-label="İlerleme" tabindex="0"><div class="rail"><div class="fill"></div></div><div class="ticks"></div><div class="tip"></div></div>
  <span id="time">0:00</span>
  <button id="speed" class="txt" aria-label="Hız">1×</button>
  <button id="cc" class="ico toggle" aria-label="Altyazı (C)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 10.2a2.4 2.4 0 1 0 0 3.6M17 10.2a2.4 2.4 0 1 0 0 3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button id="voice" class="ico toggle" aria-label="Anlatım sesi (N)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button id="gear" class="ico" aria-label="Ayarlar"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.2 4.6l1.8 1.4-2 3.4-2.1-.8a7.6 7.6 0 0 1-1.9 1.1L15.6 21h-4l-.4-2.3a7.6 7.6 0 0 1-1.9-1.1l-2.1.8-2-3.4 1.8-1.4a7.7 7.7 0 0 1 0-2.2L5.2 9.9l2-3.4 2.1.8a7.6 7.6 0 0 1 1.9-1.1L11.6 4h4l.4 2.2c.7.3 1.3.6 1.9 1.1l2.1-.8 2 3.4-1.8 1.4a7.7 7.7 0 0 1 0 2.2z" transform="translate(-1.6 -.5)"/></svg></button>
  <button id="full" class="ico" aria-label="Tam ekran (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM20 15v5h-5v-2h3v-3zM9 20H4v-5h2v3h3z"/></svg></button>
  <div id="menu" hidden>
    <div class="m-row"><span>Altyazı boyutu</span><div class="seg" data-k="size"><button data-v="s">Küçük</button><button data-v="m">Orta</button><button data-v="l">Büyük</button></div></div>
    <div class="m-row"><span>Hız</span><div class="seg" data-k="rate"><button data-v="0.75">0,75×</button><button data-v="1">1×</button><button data-v="1.25">1,25×</button><button data-v="1.5">1,5×</button></div></div>
    <div class="m-row"><span>Efekt sesleri</span><div class="seg" data-k="sfx"><button data-v="1">Açık</button><button data-v="0">Kapalı</button></div></div>
    <div class="m-keys">Boşluk: oynat · ← →: bölüm · C: altyazı · N: anlatım · F: tam ekran</div>
  </div>
</div>

<div id="start">
  <div class="card">
    <div class="kicker">Canlanan bir harita</div>
    <h1>İstanbul'un Fethi</h1>
    <div class="year">1453</div>
    <p>Bin yıllık surlar elli üç günde nasıl aşıldı?</p>
    <button id="go" disabled>Hazırlanıyor…</button>
    <div class="note">Sesli anlatım var · yaklaşık <span id="len">8</span> dakika</div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
